name: release

# Publishes pipecat-mnemoverse to PyPI with Trusted Publishing (OIDC):
# no PyPI token is stored anywhere. PyPI accepts the upload only from this
# repository, this workflow file (release.yml) and the GitHub environment
# `pypi`, as registered once on pypi.org.
#
# TO RELEASE:
#   1. Bump __version__ in src/pipecat_mnemoverse/__init__.py.
#   2. Turn CHANGELOG.md's heading into exactly `## [X.Y.Z] - YYYY-MM-DD`.
#   3. Open a PR, get it green, merge it.
#   4. git pull && git tag vX.Y.Z && git push origin vX.Y.Z   (tags the merge commit)
#
# PyPI is irreversible: a version number can never be reused, even after the
# file is deleted. Every check runs before the publish job starts.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Never cancel a release in flight: a half-run release is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ancestry check needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; merge first, then tag the merge commit"
            exit 1
          fi

      - name: Tag must match __version__ and a dated CHANGELOG heading
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          TAG_RE=$(printf '%s' "$TAG" | sed 's/[.]/[.]/g')
          VERSION=$(grep -m1 '^__version__' src/pipecat_mnemoverse/__init__.py | cut -d'"' -f2)
          echo "tag=$TAG __version__=$VERSION"
          FAIL=0
          [ "$TAG" = "$VERSION" ] || { echo "::error::__version__ reads $VERSION, the tag expects $TAG"; FAIL=1; }
          HEADING=$(grep -m1 "^## \[$TAG_RE\]" CHANGELOG.md || true)
          if [ -z "$HEADING" ]; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' heading"; FAIL=1
          elif ! printf '%s\n' "$HEADING" | grep -Eq "^## \[$TAG_RE\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$"; then
            echo "::error::CHANGELOG.md reads '$HEADING'; date the heading first: '## [$TAG] - YYYY-MM-DD'"; FAIL=1
          fi
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: python -m build

      - name: Check artifacts
        run: python -m twine check --strict dist/*

      # The steps above import the editable source tree; only the wheel shows
      # what users get.
      - name: The built wheel must install and export what it advertises
        run: |
          set -euo pipefail
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --quiet dist/*.whl
          /tmp/verify/bin/python - <<'PY'
          import pipecat_mnemoverse as pkg

          print("version:", pkg.__version__)
          missing = [n for n in pkg.__all__ if not hasattr(pkg, n)]
          assert not missing, f"__all__ names missing from the wheel: {missing}"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pipecat-mnemoverse/
    permissions:
      id-token: write # Trusted Publishing; the only job holding it
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    steps:
      # An upload that exits 0 is a claim; read back what the index serves.
      - name: PyPI must serve the new version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "https://pypi.org/pypi/pipecat-mnemoverse/json" \
                 | python3 -c "import json,sys; sys.exit(0 if '$VERSION' in json.load(sys.stdin)['releases'] else 1)"; then
              echo "pypi serves $VERSION"
              exit 0
            fi
            echo "not visible yet (attempt $attempt), waiting"
            sleep 10
          done
          echo "::error::published, but pypi.org does not list $VERSION after 60s; check the project page"
          exit 1

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
