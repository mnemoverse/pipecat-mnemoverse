name: release

# Publishes pipecat-mnemoverse to PyPI with Trusted Publishing (OIDC):
# no PyPI token is stored anywhere. PyPI accepts the upload only from this
# repository, this workflow file (release.yml) and the GitHub environment
# `pypi`, as registered once on pypi.org.
#
# TO RELEASE:
#   1. Bump __version__ in src/pipecat_mnemoverse/__init__.py.
#   2. Move the entries under `## [Unreleased]` in CHANGELOG.md to a heading
#      `## [X.Y.Z] - YYYY-MM-DD`. To check before tagging:
#      python scripts/release_gate.py check vX.Y.Z
#   3. Open a PR, get it green, merge it.
#   4. git pull && git tag vX.Y.Z && git push origin vX.Y.Z   (tags the merge commit)
#
# PyPI is irreversible: a version number can never be reused, even after the
# file is deleted. Every check runs before the publish job starts. The job
# that builds the published files pins build, twine and the build backend
# (their own dependencies resolve at build time) and runs no test code; no
# checkout keeps the job token on disk.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Never cancel a release in flight: a half-run release is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate: tag checks, lint, types and the tests. It installs the dev
  # dependencies and runs test code, so it builds nothing that gets published.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the ancestry check needs history
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Tag must be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; merge first, then tag the merge commit"
            exit 1
          fi

      # The same gate ci.yml rehearses on every pull request (scripts/release_gate.py).
      - name: Tag must match __version__ and a dated CHANGELOG heading
        run: python scripts/release_gate.py check "$GITHUB_REF_NAME"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Test
        run: python -m pytest -q

  # The bytes that get published come from here: a clean checkout, pinned
  # build and twine and the pinned build backend (their own dependencies
  # resolve at build time), in a job that installs no dev dependency and runs
  # no test code.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: python -m pip install "build==1.6.1" "twine==7.0.0"

      - name: Build
        run: python -m build

      - name: Check artifacts
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The test job imports the editable source tree; only the wheel shows what
  # users get.
  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: The built wheel must install and export what it advertises
        run: |
          set -euo pipefail
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --quiet dist/*.whl
          /tmp/verify/bin/python - <<'PY'
          import pipecat_mnemoverse as pkg

          print("version:", pkg.__version__)
          missing = [n for n in pkg.__all__ if not hasattr(pkg, n)]
          assert not missing, f"__all__ names missing from the wheel: {missing}"
          PY

  publish:
    needs: [test, build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pipecat-mnemoverse/
    permissions:
      id-token: write # Trusted Publishing; the only job holding it
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    steps:
      # An upload that exits 0 is a claim; read back what the index serves.
      - name: PyPI must serve the new version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "https://pypi.org/pypi/pipecat-mnemoverse/json" \
                 | python3 -c "import json,sys; sys.exit(0 if '$VERSION' in json.load(sys.stdin)['releases'] else 1)"; then
              echo "pypi serves $VERSION"
              exit 0
            fi
            echo "not visible yet (attempt $attempt), waiting"
            sleep 10
          done
          echo "::error::published, but pypi.org does not list $VERSION after 60s; check the project page"
          exit 1

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
