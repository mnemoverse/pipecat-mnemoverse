name: ci

# The checks the test job of release.yml runs (there the build job runs beside
# it, and publish waits for both): ruff, strict mypy and the test suite, here on
# every Python version pyproject.toml declares, plus one run against the lowest
# versions the dependency ranges allow. The release rehearsal runs the suite and
# the release gate on copies of the tree with the CHANGELOG heading of
# __version__ dated, bare and missing.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        deps: ["latest"]
        include:
          # The floor of every range in pyproject.toml that this package calls.
          - python-version: "3.11"
            deps: "lowest"
    name: test (${{ matrix.python-version }}, ${{ matrix.deps }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pin the lowest supported versions
        if: matrix.deps == 'lowest'
        run: pip install "pipecat-ai==1.15.0" "mnemoverse==0.5.2"

      - name: Installed versions
        run: pip show pipecat-ai mnemoverse | grep -E '^(Name|Version):'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Test
        run: python -m pytest -q

  # The release PR must not be the first run that sees a dated CHANGELOG heading. For each state
  # the heading of __version__ can legally be in between releases, a copy of the committed tree
  # runs the whole test suite (which must pass in all three) and the release gate of release.yml
  # (which must pass for the dated heading only). The gate is scripts/release_gate.py.
  release-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        state: [dated, bare, missing]
    name: release-rehearsal (${{ matrix.state }})
    env:
      STATE: ${{ matrix.state }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Copy the tree with the CHANGELOG heading ${{ matrix.state }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/rehearsal"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/rehearsal"
          cd "$RUNNER_TEMP/rehearsal"
          python scripts/release_gate.py stage "$STATE"

      - name: Install
        working-directory: ${{ runner.temp }}/rehearsal
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        working-directory: ${{ runner.temp }}/rehearsal
        run: python -m pytest -q

      - name: The release gate passes for the dated heading only
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/rehearsal
        run: |
          set -euo pipefail
          VERSION=$(python scripts/release_gate.py version)
          # Plain output: a refusal expected here is not an error annotation.
          VERDICT=0
          GITHUB_ACTIONS= python scripts/release_gate.py check "v$VERSION" || VERDICT=$?
          # 0 may publish, 1 refused, 2 the gate itself failed: only the exact code passes.
          if [ "$STATE" = dated ]; then EXPECTED=0; else EXPECTED=1; fi
          if [ "$VERDICT" -ne "$EXPECTED" ]; then
            echo "::error::with the heading $STATE the gate exited $VERDICT, expected $EXPECTED"
            exit 1
          fi
          echo "with the heading $STATE the gate exited $VERDICT, as expected"
