[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-mnemoverse"
version = "0.1.0"
description = "Mnemoverse memory for Pipecat agents: recall what a user said in earlier sessions and save what they say now"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Mnemoverse" }]
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai>=1.15.0",
    "mnemoverse>=0.5.2",
]
keywords = ["pipecat", "voice agents", "memory", "mnemoverse"]

[project.urls]
Homepage = "https://mnemoverse.com"
Documentation = "https://mnemoverse.com/docs/api/python-sdk"
Repository = "https://github.com/mnemoverse/pipecat-mnemoverse"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_mnemoverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
